  # ── 고용 (통계청 경제활동인구조사) ────────────────────────────
  # 한국은행 평가 프레임: ①추세 대비 취업자 증감 ②15~64세 고용률 ③산업별 취업자
  # ④실업률은 보조(2%대 저변동) — 확장실업률·쉬었음·청년고용률 병행
  - id: kr_emp_total
    name: 고용 총괄 (성별)
    source: kosis
    unit: 천명·%
    freq: M
    start_year: 2000
    refetch_years: 2
    series_first: ["취업자"]
    params:
      orgId: "101"
      tblId: "DT_1DA7001S"
      itmId: "ALL"
      objL1: "0 "              # 계(전체)

  - id: kr_emp_age
    name: 고용 총괄 (연령별)
    source: kosis
    unit: 천명·%
    freq: M
    start_year: 2000
    refetch_years: 2
    params:
      orgId: "101"
      tblId: "DT_1DA7002S"
      itmId: "ALL"
      objL1: "ALL"            # 15~19,20~29,…,15~64 등 연령계층

  # 연령별 계절조정 (사용자 확인 URL 기준).
  # objL1 을 ALL 로 두면 이 표는 오류를 내므로 연령 코드를 명시한다.
  #   75=15세이상 전체 · 63=15~64세 · 10/20/30/40/50/60=연령계층
  # itmId 는 kr_emp_total_sa 와 동일한 8개 항목(인구·경활·취업·실업·비경활·참가율·실업률·고용률).
  # 계절조정 표에는 원계열보다 연령 구간이 적어(8개), 없는 구간은 대시보드가 항목별로
  # 원계열(kr_emp_age)로 폴백하고 화면에 '(원계열)'로 표시한다.
  - id: kr_emp_age_sa
    name: 고용 총괄 (연령별, 계절조정)
    source: kosis
    unit: 천명·%
    freq: M
    start_year: 2000
    refetch_years: 2
    params:
      orgId: "101"
      tblId: "DT_1DA9002S"
      itmId: "T10 T20 T30 T40 T50 T60 T80 T90"
      objL1: "75 10 20 30 40 50 60 63"

  # 고용보조지표 — 미국 U-1~U-6 에 대응하는 확장 실업 지표.
  #   고용보조지표1 = (실업자 + 시간관련 추가취업가능자) / 경제활동인구
  #   고용보조지표2 = (실업자 + 잠재경제활동인구) / 확장경제활동인구
  #   고용보조지표3 = (실업자 + 시간관련 추가취업가능자 + 잠재경제활동인구) / 확장경제활동인구
  # 3번이 미국 U-6 에 가장 가깝다(확장실업률). 계절조정 계열은 공표되지 않아 원계열이다.
  - id: kr_emp_supp
    name: 고용보조지표 (확장실업률)
    source: kosis
    unit: '%'
    freq: M
    start_year: 2015
    refetch_years: 2
    params:
      orgId: "101"
      tblId: "DT_1DA7300S"
      itmId: "ALL"
      objL1: "ALL"

