  # 신용카드 이용실적 (여신금융협회 → ECOS 601Y003)
  #   소매판매(통계청)는 표본조사라 2개월 시차가 있는데 카드는 훨씬 빨라 선행지표로 쓴다.
  #   item_code 는 'ITEM1/ITEM2' 두 축. ITEM2 = 00(합계) 로 고정한다(10 은행계 / 20 비은행계).
  #   ※ 601Y003 은 '신용카드'만이다. 체크카드 월별 계열은 ECOS 에 없다(621Y007 은 연간).
  #   ※ 지역·소비유형별(601Y002)은 2023-08 로 끊겨 쓰지 않는다.
  - id: kr_card
    name: 신용카드 이용실적
    source: ecos
    unit: 백만원·천건
    freq: M
    lookback_years: 16
    params:
      stat_code: "601Y003"
      item_codes:
        - "201010/00"     # 개인 일반구매(일시불) 이용금액  ← 소비 대용치의 핵심
        - "201020/00"     # 개인 할부구매 이용금액
        - "201030/00"     # 개인 현금서비스 이용금액 (소비가 아니라 단기카드대출)
        - "201000/00"     # 개인 이용금액 (일시불+할부+현금서비스)
        - "202000/00"     # 법인 이용금액
        - "200000/00"     # 전체 이용금액
        - "101010/00"     # 개인 일반구매 이용건수 (건당 단가 계산용)
        - "101020/00"     # 개인 할부구매 이용건수
