    series_first: ["총지수"]
    params:
      orgId: "101"
      tblId: "DT_1J22002"
      itmId: "T "
      objL1: "T10 "
      objL2: "00 21 211 212 213 22 221 222 223 "

  # 식료품·에너지 제외(근원) 등
  - id: kr_cpi_core
