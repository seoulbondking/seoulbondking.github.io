  # 🇺🇸 미국 (BLS·BEA·Census·FRED) — 미국 정부 API라 Actions에서도 수집 가능
  # ══════════════════════════════════════════════════════════════

  # ── 연준 (FRED) — 지급준비금·정책금리 ────────────────────────────
  #   WRESBAL : 연준에 예치된 지급준비금 잔액. 주간(수요일 마감) 평균, 십억달러.
  #             '상업은행이 연준에 맡겨둔 돈'이며 QT 로 줄고 QE 로 는다.
  #   IORB    : 지급준비금 부리금리. 2021-07-29 부터.
  #   IOER    : 그 전신(초과지준 부리금리, 2008-10~2021-07-28). 역사 연결용으로 같이 받는다.
  #             둘은 한 계열의 개명에 가까워 화면에서 이어 붙여 쓴다.
  #   EFFR    : 실효연방기금금리. 은행 간 무담보 익일물 실거래의 '거래량 가중 중앙값'.
  #             연준이 목표범위를 정하면 시장이 실제로 얼마에 거래했는지를 보여주는 결과값.
  #   RRPONTSYD      : 익일물 역레포(ON RRP) 잔액, 십억달러. MMF 등이 연준에 하루 예치한 돈.
  #   RRPONTSYAWARD  : 그 역레포 금리. 금리 하단(floor)을 만든다.
  #             통상 역레포금리 ≤ EFFR ≤ IORB 로 눌린다. EFFR 이 IORB 위로 붙으면 준비금 부족 신호.
  - id: us_fed
    name: 연준 지급준비금·정책금리
    source: fred
    unit: 십억달러·%
    freq: D
    start_year: 2008
    merge_always: true
    series_first: ["지급준비금 잔액"]
    params:
      series:
        WRESBAL: 지급준비금 잔액
        RRPONTSYD: 역레포 잔액
        IORB: IORB (지준부리금리)
        IOER: IOER (초과지준 부리금리, 종료)
        EFFR: EFFR (실효연방기금금리)
        RRPONTSYAWARD: 역레포 금리


